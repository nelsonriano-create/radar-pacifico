# ============================================================
# RADAR PACÍFICO — Tarea automática diaria del recolector
# GitHub la ejecuta sola todos los días a las 6:00 a. m. (Bogotá)
# y también se puede lanzar a mano con el botón "Run workflow".
# ============================================================
name: Recolector diario

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 6:00 a. m. en Bogotá
  workflow_dispatch:          # botón para correrlo a mano
  push:                       # y cuando se sube un conector nuevo o cambiado
    branches: [main]
    paths:
      - "codigo/conector-*.js"
      - "recolector/**"

permissions:
  contents: write             # para poder guardar el archivo de datos

# Nunca dos corridas a la vez: si llega otra, espera a que termine la anterior
concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Traer el código del Radar
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Recolectar oportunidades
        env:
          SECOP_TOKEN: ${{ secrets.SECOP_TOKEN }}
        run: node recolector/recolectar.js

      - name: Guardar los datos del día
        run: |
          git config user.name "Recolector Radar"
          git config user.email "recolector@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet && exit 0
          git commit -m "Datos del $(date -u +%Y-%m-%d)"
          # Si el repositorio cambió mientras se recolectaba, ponerse al día y reintentar
          for intento in 1 2 3 4 5; do
            git push && exit 0
            echo "Fallo al subir (intento $intento); reintento en 20 s"
            sleep 20
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
