# ============================================================
# RADAR PACÍFICO — Tarea automática diaria del recolector
# GitHub la ejecuta sola todos los días a las 6:00 a. m. (Bogotá)
# y también se puede lanzar a mano con el botón "Run workflow".
# ============================================================
name: Recolector diario

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 6:00 a. m. en Bogotá
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write             # para poder guardar el archivo de datos

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Traer el código del Radar
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recolectar oportunidades
        env:
          SECOP_TOKEN: ${{ secrets.SECOP_TOKEN }}
        run: node recolector/recolectar.js

      - name: Guardar los datos del día
        run: |
          git config user.name "Recolector Radar"
          git config user.email "recolector@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Datos del $(date -u +%Y-%m-%d)"
          git push
